services:
  antigravity2api:
    build: .
    container_name: antigravity2api
    ports:
      - "10004:10004"
    environment:
      PORT: 10004
      HOST: 0.0.0.0
    volumes:
      - ./data:/app/data
      - ./public/images:/app/public/images
      - ./.env:/app/.env
      - ./config.json:/app/config.json
      - ./security.json:/app/security.json
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:10004/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
